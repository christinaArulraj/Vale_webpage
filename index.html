<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enter your login credential</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #fff;
}

.container {
    width: 350px;
    background: rgba(255, 255, 255, 0.08);
    padding: 40px;
    border-radius: 15px;
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

h2 {
    text-align: center;
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: none;
    border-radius: 8px;
    outline: none;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    border: none;
    border-radius: 8px;
    background: #00c6ff;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #0072ff;
}

.error {
    color: #ff6b6b;
    font-size: 14px;
    text-align: center;
    margin-top: 10px;
}

.dashboard {
    display: none;
    text-align: center;
}

.logout-btn {
    margin-top: 20px;
    background: #ff4b2b;
}

.logout-btn:hover {
    background: #d63031;
}
</style>
</head>

<body>

<div class="container">

    <!-- Login Form -->
    <div id="login-section">
        <h2>Happy valentines day</h2>
        <input type="text" id="username" placeholder="how do I call you">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <div class="error" id="error-msg"></div>
    </div>

   <div id="valentinePage" class="hidden">
        <h1>❤️ Happy Valentine’s Day ❤️</h1>
        <h2>Will you be my Valentine?</h2>
        <button id="yesBtn" onclick="sayYes()">Yes 💖</button>
        <button id="noBtn" onmouseover="moveNoButton()">No 🙈</button>
        <div class="success-message" id="successMsg"></div>
    </div>

</div>

<script>
function login() {
    const user = document.getElementById("username").value;
    const pass = document.getElementById("password").value;

    // Demo credentials
    if (user === "admin" && pass === "love123") {
        document.getElementById("loginPage").classList.add("hidden");
        document.getElementById("valentinePage").classList.remove("hidden");
    } else {
        document.getElementById("error").innerText = "Invalid login details!";
    }
}

function sayYes() {
    document.getElementById("successMsg").innerHTML = "Yayyyy! 💕 You just made my day! 💕";
}

function moveNoButton() {
    const button = document.getElementById("noBtn");
    const x = Math.floor(Math.random() * 200) - 100;
    const y = Math.floor(Math.random() * 200) - 100;
    button.style.transform = `translate(${x}px, ${y}px)`;
}
    
</script>

</body>
</html>
