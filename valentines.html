<!DOCTYPE html>
<html>
<head>
    <title>Happy Valentine's Day</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff4d6d, #ff758c);
            font-family: Arial, sans-serif;
            text-align: center;
            color: white;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 26px;
            margin-bottom: 30px;
        }

        button {
            padding: 12px 25px;
            margin: 10px;
            border: none;
            font-size: 18px;
            cursor: pointer;
            border-radius: 8px;
        }

        .yes {
            background: white;
            color: #ff4d6d;
        }

        .no {
            background: #fff;
            color: #ff4d6d;
            position: relative;
        }
    </style>
</head>
<body>

<div>
    <h1>❤️ Happy Valentine’s Day ❤️</h1>
    <h2>Will you be my Valentine?</h2>

    <button class="yes" onclick="alert('Yayyyy! 💕 You made my day!')">Yes 💖</button>
    <button class="no" onmouseover="moveButton(this)">No 🙈</button>
</div>

<script>
function moveButton(button) {
    const x = Math.random() * 300 - 150;
    const y = Math.random() * 300 - 150;
    button.style.transform = `translate(${x}px, ${y}px)`;
}
</script>

</body>
</html>
